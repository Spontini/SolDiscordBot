name: Rust and ARM64 container
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libopus-dev
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-1.99-linux-${{ hashFiles('Cargo.lock') }}
      - run: cargo +1.99.0 fmt --all --check
      - run: cargo +1.99.0 test --locked
      - run: cargo +1.99.0 clippy --locked --all-targets -- -D warnings
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: soldiscordbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify ARM64 runtime tools without credentials
        run: |
          test "$(docker image inspect soldiscordbot:ci --format '{{.Architecture}}')" = arm64
          docker run --rm --entrypoint sh soldiscordbot:ci -c 'ffmpeg -version >/dev/null && yt-dlp --version && node --version'
